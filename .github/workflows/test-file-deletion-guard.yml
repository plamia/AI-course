name: Test Deletion Guard

on:
  pull_request:
    branches: [ main ]

jobs:
  check-test-deletion:
    name: Test File Deletion Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Test Deletion Guard Script
        run: bash scripts/ci/check-test-deletion.sh origin/main