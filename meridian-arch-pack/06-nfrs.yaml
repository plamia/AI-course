governed_set:
  source: "Meridian Reference Case A & Module 300 Design AI-AC"
  last_reviewed: "2026-09-26"
  status: "accepted"

nfr_budgets:
  - id: "NFR-01"
    metric: "Cart-to-checkout p95 end-to-end latency"
    family: "Latency"
    containers:
      - "Apollo Gateway"
      - "Cart Service"
      - "Checkout Service"
    target: "p95 < 1500ms (EU region, including PSD2 SCA round-trip)"
    conditions: "Representative peak load, production model and tool chain, EU region"
    enforcement: "Automated synthetic checkout probes executed nightly in CI pipeline; build fails on breach"
    owner: "Core Commerce Engineering Team"
    review_trigger: "Payment gateway integration or SCA flow changes"
    justification: "PSD2 SCA for EU payments requires mandatory round-trip overhead."

  - id: "NFR-02"
    metric: "Black Friday peak sustainable throughput"
    family: "Reliability"
    containers:
      - "Apollo Gateway"
      - "Cart Service"
      - "Checkout Service"
    target: "8000 RPS sustained, 12000 RPS burst (10 min window)"
    conditions: "Peak holiday shopping traffic simulation across 22 regional endpoints"
    enforcement: "Automated load test (Locust/k6) executed on PR merge to release branch; gate blocks deployment"
    owner: "Platform Reliability Engineering Team"
    review_trigger: "Traffic scaling profile or regional store expansion changes"
    justification: "Black Friday 2024 had a 40-minute outage in the EU region."

  - id: "NFR-03"
    metric: "Inventory stock accuracy & phantom-stock rate"
    family: "Quality"
    containers:
      - "Inventory Read Cache"
      - "Order Event Bus"
      - "Cart Service"
    target: "< 2% phantom-stock cancellation rate on click-and-collect orders"
    conditions: "Active store pick-up transactions across 1,400 retail stores"
    enforcement: "Daily automated reconciliation script comparing Redis cache against SAP ECC ground truth; alert on threshold breach"
    owner: "Inventory & Supply Chain Engineering Team"
    review_trigger: "SAP batch sync frequency or store POS synchronization changes"
    justification: "-7% of click-and-collect orders cancelled at pickup due to phantom stock."

  - id: "NFR-04"
    metric: "Platform operational availability"
    family: "Reliability"
    containers:
      - "Apollo Gateway"
      - "Checkout Service"
      - "Identity Service"
    target: "99.95% uptime per region per month (excluding planned maintenance)"
    conditions: "Continuous 24/7 operational traffic across 22 operating countries"
    enforcement: "24/7 uptime monitoring + SLO error-budget alerting (pager trigger at 99.92%)"
    owner: "Site Reliability Engineering Team"
    review_trigger: "Infrastructure topology or multi-region failover strategy changes"
    justification: "No acceptable downtime window — stores must keep selling throughout."

  - id: "NFR-05"
    metric: "Cloud compute cost per completed checkout"
    family: "Cost"
    containers:
      - "All Phase 1 hot-path microservices"
      - "AWS Infrastructure"
    target: "< $0.04 / completed checkout transaction (excluding third-party payment fees)"
    conditions: "Stated AWS pricing, average token/compute usage, and projected transaction volume"
    enforcement: "Daily AWS Cost and Usage Report (CUR) allocation analysis broken down per container; alert on budget ceiling breach"
    owner: "Finance & Cloud Platform Teams"
    review_trigger: "Cloud pricing tier, instance type, or transaction volume profile changes"
    justification: "$42M over 18 months budget ceiling and digital revenue growth targets."

  - id: "NFR-06"
    metric: "Identity authentication & token verification latency"
    family: "Latency"
    containers:
      - "Identity Service"
      - "Auth0 IDAM"
    target: "p95 < 250ms for token verification and session refresh"
    conditions: "Simulated concurrent user token validation requests across regional edge nodes"
    enforcement: "Synthetic auth-flow probes executed every 60 seconds from regional edge nodes; runtime alert on SLO breach"
    owner: "Security & Identity Engineering Team"
    review_trigger: "Auth0 plan tier or identity provider configuration changes"
    justification: "Customer creates an account on web, must be instantly usable in-store without gating POS."

  - id: "NFR-07"
    metric: "EU SCA compliance & PII data isolation invariant"
    family: "Security & Compliance"
    containers:
      - "Checkout Service"
      - "Stripe Gateway"
    target: "100% of EU card payments complete PSD2 SCA; 0 PII fields outside documented PCI-DSS CDE"
    conditions: "All cross-border and regional EU electronic payment transactions"
    enforcement: "CI control-conformance static scan + nightly data residency egress audit; deployment gate blocks on invariant violation"
    owner: "Security & Compliance Team"
    review_trigger: "PCI-DSS scope change or payment processor integration updates"
    justification: "PSD2 SCA for EU payments and PCI-DSS Level 1 compliance mandate."